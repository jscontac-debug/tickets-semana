<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Tickets Semana</title>
  <link rel="manifest" href="manifest.json?v=13">
  <meta name="theme-color" content="#007a3d">
  <link rel="apple-touch-icon" href="icon-512.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;background:#f4f4f4;font-family:Arial,sans-serif;color:#222}
    .app{width:100%;padding:34px 24px 40px;max-width:760px;margin:0 auto}
    h1{margin:0;text-align:center;font-size:36px;font-weight:800}
    .week{text-align:center;font-size:20px;color:#555;line-height:1.45;margin:10px 0 28px}
    .uploadBtn{position:relative;width:100%;border-radius:22px;padding:28px 18px;margin-bottom:16px;background:#007a3d;color:white;font-size:28px;font-weight:800;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.12);text-transform:uppercase;text-align:center;overflow:hidden}
    .uploadBtn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}
    .btn{display:block;width:100%;border:none;border-radius:22px;padding:24px;margin-bottom:16px;color:white;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.12);text-transform:uppercase;text-align:center}
    .uploadBtn:active,.btn:active{transform:scale(.98)}
    .secondary{background:#2f2f2f;margin-top:18px}.calc{background:#0057b8}.warning{background:#d97706}.danger{background:#c9002b}
    .counter{background:white;border-radius:22px;padding:24px;margin:24px 0;font-size:21px;line-height:1.9;box-shadow:0 4px 10px rgba(0,0,0,.08)}
    .empty-note{display:none;background:#fff3cd;color:#5c4600;padding:16px;border-radius:16px;margin-top:16px;font-size:18px;line-height:1.4}
    .message{position:fixed;inset:0;background:white;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:9999;text-align:center;padding:24px}
    .check{font-size:115px;color:#007a3d;margin-bottom:20px}.messageText{font-size:34px;font-weight:bold;color:#007a3d}
    .modal{position:fixed;inset:0;display:none;background:rgba(0,0,0,.55);z-index:10000;padding:18px;overflow:auto}
    .modalBox{background:white;border-radius:20px;padding:22px;max-width:720px;margin:24px auto;box-shadow:0 8px 24px rgba(0,0,0,.25)}
    .modalBox h2{margin-top:0;text-align:center}
    .resultTable{width:100%;border-collapse:collapse;font-size:15px}.resultTable th,.resultTable td{border-bottom:1px solid #ddd;padding:8px 4px;text-align:right}.resultTable th:first-child,.resultTable td:first-child{text-align:left}.totalRow{font-weight:bold;background:#f0f0f0}


    .sectionCard{background:white;border-radius:22px;padding:16px;margin-bottom:18px;box-shadow:0 4px 10px rgba(0,0,0,.08)}
    .sectionTitle{font-size:23px;font-weight:800;text-transform:uppercase;margin-bottom:12px;color:#222;text-align:center}
    .actionGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .fileBtn{position:relative;border-radius:16px;padding:20px 10px;background:#007a3d;color:white;font-size:18px;font-weight:800;text-align:center;overflow:hidden;box-shadow:0 3px 8px rgba(0,0,0,.10)}
    .fileBtn.gallery{background:#0057b8}
    .fileBtn input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}

    .manageGrid{display:grid;grid-template-columns:1fr;gap:16px;margin-top:16px}
    .ticketCard{background:#fff;border-radius:16px;padding:12px;box-shadow:0 3px 8px rgba(0,0,0,.1)}
    .ticketCard img{width:100%;max-height:320px;object-fit:contain;background:#eee;border-radius:12px;display:block}
    .ticketInfo{font-size:15px;margin:10px 0;line-height:1.4;color:#333}
    .rowBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .smallBtn{border:none;border-radius:12px;padding:12px;color:#fff;font-weight:800;font-size:14px;cursor:pointer}
    .rotateBtn{background:#0057b8}.deleteBtn{background:#c9002b}.amountBtn{background:#6d28d9}.pdfBtn{background:#007a3d}
    .edit{background:#6d28d9}.green{background:#007a3d}

    @media(max-width:420px){h1{font-size:32px}.week{font-size:18px}.uploadBtn{font-size:24px;padding:25px 14px}.counter{font-size:19px}.btn{font-size:19px}.resultTable{font-size:13px}}
  </style>
</head>
<body>
<div class="app">
  <h1>Tickets Semana</h1>
  <div class="week" id="weekInfo"></div>
  <div class="sectionCard">
    <div class="sectionTitle">Desayuno</div>
    <div class="actionGrid">
      <div class="fileBtn">Hacer foto<input type="file" accept="image/*" capture="environment" data-section="Desayuno" onchange="handleFiles(event)"></div>
      <div class="fileBtn gallery">Galería<input type="file" accept="image/*" multiple data-section="Desayuno" onchange="handleFiles(event)"></div>
    </div>
  </div>

  <div class="sectionCard">
    <div class="sectionTitle">Comida</div>
    <div class="actionGrid">
      <div class="fileBtn">Hacer foto<input type="file" accept="image/*" capture="environment" data-section="Comida" onchange="handleFiles(event)"></div>
      <div class="fileBtn gallery">Galería<input type="file" accept="image/*" multiple data-section="Comida" onchange="handleFiles(event)"></div>
    </div>
  </div>

  <div class="sectionCard">
    <div class="sectionTitle">Cena</div>
    <div class="actionGrid">
      <div class="fileBtn">Hacer foto<input type="file" accept="image/*" capture="environment" data-section="Cena" onchange="handleFiles(event)"></div>
      <div class="fileBtn gallery">Galería<input type="file" accept="image/*" multiple data-section="Cena" onchange="handleFiles(event)"></div>
    </div>
  </div>

  <div class="sectionCard">
    <div class="sectionTitle">Tickets gasoil</div>
    <div class="actionGrid">
      <div class="fileBtn">Hacer foto<input type="file" accept="image/*" capture="environment" data-section="Tickets gasoil" onchange="handleFiles(event)"></div>
      <div class="fileBtn gallery">Galería<input type="file" accept="image/*" multiple data-section="Tickets gasoil" onchange="handleFiles(event)"></div>
    </div>
  </div>

  <div class="sectionCard">
    <div class="sectionTitle">Parking</div>
    <div class="actionGrid">
      <div class="fileBtn">Hacer foto<input type="file" accept="image/*" capture="environment" data-section="Parking" onchange="handleFiles(event)"></div>
      <div class="fileBtn gallery">Galería<input type="file" accept="image/*" multiple data-section="Parking" onchange="handleFiles(event)"></div>
    </div>
  </div>
  <div class="counter" id="counterBox"></div>
  <button class="btn edit" onclick="openManagePicker()">Modificar / revisar tickets</button>
  <button class="btn calc" onclick="showEconomicSummary()">Calcular importes</button>
  <button class="btn secondary" onclick="generateAllPDFs()">Generar PDFs</button>
  <button class="btn green" onclick="updateApp()">Actualizar aplicación</button>
  <button class="btn warning" onclick="clearWeeklyTickets()">Borrar tickets semanales</button>
  <button class="btn danger" onclick="clearMonthlyTickets()">Borrar tickets mensuales</button>
  <div class="empty-note" id="emptyNote">No hay tickets guardados en el periodo actual.</div>
</div>
<div class="message" id="message"><div class="check">✔</div><div class="messageText">Acción completada</div></div>
<div class="modal" id="summaryModal"><div class="modalBox"><h2>Resumen económico</h2><div id="summaryContent"></div><button class="btn secondary" onclick="closeSummary()">Cerrar</button></div></div>
<div class="modal" id="manageModal"><div class="modalBox"><h2 id="manageTitle">Modificar tickets</h2><div id="manageContent"></div><button class="btn secondary" onclick="closeManage()">Cerrar</button></div></div>
<script>
const DB_NAME="ticketsSemanaDB_v10", STORE_NAME="tickets";
let db=null;let currentManageSection=null;
const sections=["Desayuno","Comida","Cena","Tickets gasoil","Parking"];
const weeklySections=["Desayuno","Comida","Cena","Parking"];
const monthlySections=["Tickets gasoil"];
const allowances={"Desayuno":4,"Comida":18,"Cena":13,"Tickets gasoil":0,"Parking":0};

window.addEventListener("load",async()=>{try{db=await openDB();showWeekInfo();await updateCounters();registerServiceWorker()}catch(e){alert("Error al iniciar la app: "+e.message)}});
function registerServiceWorker(){if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js?v=13").catch(()=>{})}}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE_NAME))d.createObjectStore(STORE_NAME,{keyPath:"id"})};r.onsuccess=e=>res(e.target.result);r.onerror=()=>rej(new Error("No se pudo abrir la memoria local"))})}
function getISOWeekData(date=new Date()){const temp=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));const day=temp.getUTCDay()||7;temp.setUTCDate(temp.getUTCDate()+4-day);const ys=new Date(Date.UTC(temp.getUTCFullYear(),0,1));const week=Math.ceil((((temp-ys)/86400000)+1)/7);const year=temp.getUTCFullYear();const monday=new Date(date);const localDay=monday.getDay()||7;monday.setDate(monday.getDate()-localDay+1);monday.setHours(0,0,0,0);const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);sunday.setHours(23,59,59,999);return{week,year,monday,sunday}}
function getMonthData(date=new Date()){const year=date.getFullYear(), monthIndex=date.getMonth();const firstDay=new Date(year,monthIndex,1);firstDay.setHours(0,0,0,0);const lastDay=new Date(year,monthIndex+1,0);lastDay.setHours(23,59,59,999);const monthNumber=monthIndex+1;const monthName=date.toLocaleDateString("es-ES",{month:"long"});return{year,monthIndex,monthNumber,monthName,firstDay,lastDay}}
function isMonthlySection(section){return section==="Tickets gasoil"}
function formatDate(d){return d.toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric"})}
function formatMoney(n){return Number(n||0).toLocaleString("es-ES",{style:"currency",currency:"EUR"})}
function parseAmount(v){if(v===null)return 0;const clean=String(v).replace(",",".").replace(/[^\d.-]/g,"");const n=parseFloat(clean);return Number.isFinite(n)?n:0}











function showWeekInfo(){const w=getISOWeekData(),m=getMonthData();const mt=m.monthName.charAt(0).toUpperCase()+m.monthName.slice(1);document.getElementById("weekInfo").innerHTML=`Semana ${w.week} / ${w.year}<br>Periodo semanal: ${formatDate(w.monday)} - ${formatDate(w.sunday)}<br>Gasoil mensual: ${mt} ${m.year}`}

async function handleFiles(event){try{const input=event.target,files=Array.from(input.files||[]),section=input.dataset.section;if(!files.length||!section)return;const w=getISOWeekData(),m=getMonthData();for(let i=0;i<files.length;i++){const file=files[i];let amount=0;let liters=0;if(section==="Tickets gasoil"){liters=parseAmount(prompt(`Litros de gasoil ${files.length>1?"("+(i+1)+"/"+files.length+")":""}:`,""));amount=parseAmount(prompt(`Importe del ticket de gasoil ${files.length>1?"("+(i+1)+"/"+files.length+")":""} en euros:`,""))}else{amount=parseAmount(prompt(`Importe del ticket de ${section} ${files.length>1?"("+(i+1)+"/"+files.length+")":""} en euros:`,""))}const base64=await fileToCompressedBase64(file);await saveTicket({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),section,image:base64,amount,liters,rotation:0,createdAt:file.lastModified||Date.now(),week:w.week,year:w.year,month:m.monthNumber,monthYear:m.year})}input.value="";showCompleted();await updateCounters()}catch(e){alert("No se pudo guardar la imagen: "+e.message)}}
function fileToCompressedBase64(file){return new Promise((res,rej)=>{const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{const maxWidth=1200,scale=Math.min(1,maxWidth/img.width);const canvas=document.createElement("canvas");canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);res(canvas.toDataURL("image/jpeg",.82))};img.onerror=()=>rej(new Error("No se pudo leer la imagen"));img.src=e.target.result};reader.onerror=()=>rej(new Error("No se pudo abrir el archivo"));reader.readAsDataURL(file)})}
function saveTicket(ticket){return new Promise((res,rej)=>{const tx=db.transaction(STORE_NAME,"readwrite");tx.objectStore(STORE_NAME).put(ticket);tx.oncomplete=res;tx.onerror=()=>rej(new Error("No se pudo guardar en memoria local"))})}
function getTickets(){return new Promise((res,rej)=>{const tx=db.transaction(STORE_NAME,"readonly");const r=tx.objectStore(STORE_NAME).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(new Error("No se pudieron leer los tickets"))})}

function getTicketById(id){return new Promise((res,rej)=>{const tx=db.transaction(STORE_NAME,"readonly");const r=tx.objectStore(STORE_NAME).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(new Error("No se pudo leer el ticket"))})}
function deleteTicketById(id){return new Promise((res,rej)=>{const tx=db.transaction(STORE_NAME,"readwrite");tx.objectStore(STORE_NAME).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(new Error("No se pudo borrar el ticket"))})}

async function getCurrentWeekTickets(section=null){const w=getISOWeekData(),all=await getTickets();return all.filter(t=>t.week===w.week&&t.year===w.year).filter(t=>!section||t.section===section).sort((a,b)=>a.createdAt-b.createdAt)}
async function getCurrentMonthTickets(section=null){const m=getMonthData(),all=await getTickets();return all.filter(t=>{if(t.month&&t.monthYear)return t.month===m.monthNumber&&t.monthYear===m.year;const d=new Date(t.createdAt);return d>=m.firstDay&&d<=m.lastDay}).filter(t=>!section||t.section===section).sort((a,b)=>a.createdAt-b.createdAt)}
async function getCurrentPeriodTickets(section=null){return isMonthlySection(section)?getCurrentMonthTickets(section):getCurrentWeekTickets(section)}

async function updateCounters(){const data={};let total=0;for(const section of sections){const tickets=await getCurrentPeriodTickets(section);const amount=tickets.reduce((s,t)=>s+Number(t.amount||0),0);const liters=tickets.reduce((s,t)=>s+Number(t.liters||0),0);data[section]={count:tickets.length,amount,liters};total+=tickets.length}document.getElementById("counterBox").innerHTML=`Desayuno: ${data["Desayuno"].count} tickets · ${formatMoney(data["Desayuno"].amount)}<br>Comida: ${data["Comida"].count} tickets · ${formatMoney(data["Comida"].amount)}<br>Cena: ${data["Cena"].count} tickets · ${formatMoney(data["Cena"].amount)}<br>Tickets gasoil: ${data["Tickets gasoil"].count} tickets · ${data["Tickets gasoil"].liters.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})} L · ${formatMoney(data["Tickets gasoil"].amount)}<br>Parking: ${data["Parking"].count} tickets · ${formatMoney(data["Parking"].amount)}`;document.getElementById("emptyNote").style.display=total===0?"block":"none"}
function showCompleted(){const msg=document.getElementById("message");msg.style.display="flex";if(navigator.vibrate)navigator.vibrate(120);setTimeout(()=>{msg.style.display="none"},1000)}
async function generateAllPDFs(){let generated=0;for(const section of sections){const tickets=await getCurrentPeriodTickets(section);if(tickets.length){await generatePDF(section,tickets);generated++}}if(!generated)alert("No hay tickets para generar PDFs en el periodo actual.")}
async function generatePDF(section,tickets){const{jsPDF}=window.jspdf;const pdf=new jsPDF("p","mm","a4");const w=getISOWeekData(),m=getMonthData(),monthly=isMonthlySection(section);pdf.setFont("helvetica","bold");pdf.setFontSize(18);pdf.text(`TICKETS ${section.toUpperCase()}`,10,15);pdf.setFont("helvetica","normal");pdf.setFontSize(12);if(monthly){const mt=m.monthName.charAt(0).toUpperCase()+m.monthName.slice(1);pdf.text(`Mes: ${mt} / ${m.year}`,10,24);pdf.text(`Periodo: ${formatDate(m.firstDay)} - ${formatDate(m.lastDay)}`,10,31)}else{pdf.text(`Semana ${w.week} / ${w.year}`,10,24);pdf.text(`Periodo: ${formatDate(w.monday)} - ${formatDate(w.sunday)}`,10,31)}let x=10,y=40;const pageWidth=210,pageHeight=297,margin=10,gap=5,width=60,height=105;for(let i=0;i<tickets.length;i++){if(y+height>pageHeight-margin){pdf.addPage();x=margin;y=margin}const img=await imageWithRotation(tickets[i].image,tickets[i].rotation||0);pdf.addImage(img,"JPEG",x,y,width,height,undefined,"FAST");x+=width+gap;if(x+width>pageWidth-margin){x=margin;y+=height+gap}}const safeSection=section.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g,"_").replace(/[^a-zA-Z0-9_]/g,"");if(monthly)pdf.save(`${safeSection}_Mes_${String(m.monthNumber).padStart(2,"0")}_${m.year}.pdf`);else pdf.save(`${safeSection}_Semana_${w.week}_${w.year}.pdf`)}

async function showEconomicSummary(){const rows=[];let totalSpent=0,totalAllowance=0,totalGain=0,totalLiters=0;let gasoilAmount=0;for(const section of sections){const tickets=await getCurrentPeriodTickets(section);const count=tickets.length;const spent=tickets.reduce((s,t)=>s+Number(t.amount||0),0);const liters=tickets.reduce((s,t)=>s+Number(t.liters||0),0);let allowance=count*(allowances[section]||0);let gain=allowance-spent;if(section==="Tickets gasoil"){allowance=0;gain=0;gasoilAmount+=spent;totalLiters+=liters}else if(section==="Parking"){allowance=spent;gain=0;totalSpent+=spent;totalAllowance+=allowance;totalGain+=gain}else{totalSpent+=spent;totalAllowance+=allowance;totalGain+=gain}rows.push({section,count,spent,liters,allowance,gain})}let html=`<table class="resultTable"><thead><tr><th>Partida</th><th>Nº</th><th>Litros</th><th>Gastado</th><th>Abono</th><th>Resultado</th></tr></thead><tbody>`;rows.forEach(r=>{html+=`<tr><td>${r.section}</td><td>${r.count}</td><td>${r.liters?r.liters.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" L":"-"}</td><td>${formatMoney(r.spent)}</td><td>${r.section==="Tickets gasoil"?"No computa":formatMoney(r.allowance)}</td><td>${r.section==="Tickets gasoil"?"No computa":formatMoney(r.gain)}</td></tr>`});html+=`<tr class="totalRow"><td>TOTAL COMPUTABLE</td><td></td><td>-</td><td>${formatMoney(totalSpent)}</td><td>${formatMoney(totalAllowance)}</td><td>${formatMoney(totalGain)}</td></tr></tbody></table><p style="font-size:14px;line-height:1.4;margin-top:14px"><strong>Gasoil:</strong> ${totalLiters.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})} L · ${formatMoney(gasoilAmount)}. No afecta al resultado porque se paga con tarjeta de empresa.</p>`;document.getElementById("summaryContent").innerHTML=html;document.getElementById("summaryModal").style.display="block"}
function closeSummary(){document.getElementById("summaryModal").style.display="none"}


function imageWithRotation(base64,rotation){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const r=((rotation||0)%360+360)%360;const canvas=document.createElement("canvas");if(r===90||r===270){canvas.width=img.height;canvas.height=img.width}else{canvas.width=img.width;canvas.height=img.height}const ctx=canvas.getContext("2d");ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(r*Math.PI/180);ctx.drawImage(img,-img.width/2,-img.height/2);res(canvas.toDataURL("image/jpeg",.86))};img.onerror=()=>rej(new Error("No se pudo rotar la imagen"));img.src=base64})}
async function generateSingleSectionPDF(section){const tickets=await getCurrentPeriodTickets(section);if(!tickets.length){alert("No hay tickets en esta sección.");return}await generatePDF(section,tickets)}
function openManagePicker(){currentManageSection=null;document.getElementById("manageTitle").textContent="Modificar tickets";let html="";sections.forEach(s=>{html+=`<button class="btn edit" onclick="openManageSection('${s}')">${s}</button>`});document.getElementById("manageContent").innerHTML=html;document.getElementById("manageModal").style.display="block"}
async function openManageSection(section){currentManageSection=section;document.getElementById("manageTitle").textContent="Modificar: "+section;const tickets=await getCurrentPeriodTickets(section);let html=`<button class="btn green" onclick="generateSingleSectionPDF('${section}')">Generar solo este PDF</button><button class="btn secondary" onclick="openManagePicker()">Volver a secciones</button>`;if(!tickets.length){html+="<p>No hay tickets en esta sección.</p>"}else{html+='<div class="manageGrid">';tickets.forEach((t,i)=>{html+=`<div class="ticketCard"><img src="${t.image}" style="transform:rotate(${t.rotation||0}deg)"><div class="ticketInfo"><strong>Ticket ${i+1}</strong><br>Importe: ${formatMoney(t.amount||0)}${t.section==="Tickets gasoil"?`<br>Litros: ${Number(t.liters||0).toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})} L`:""}<br>Rotación: ${t.rotation||0}°</div><div class="rowBtns"><button class="smallBtn rotateBtn" onclick="rotateTicket('${t.id}')">Girar 90°</button><button class="smallBtn amountBtn" onclick="editTicketAmount('${t.id}')">Modificar importe</button><button class="smallBtn deleteBtn" onclick="deleteOneTicket('${t.id}')">Borrar</button><button class="smallBtn pdfBtn" onclick="generateSingleSectionPDF('${section}')">PDF sección</button></div></div>`});html+="</div>"}document.getElementById("manageContent").innerHTML=html;document.getElementById("manageModal").style.display="block"}
function closeManage(){document.getElementById("manageModal").style.display="none"}
async function rotateTicket(id){const t=await getTicketById(id);if(!t)return;t.rotation=((t.rotation||0)+90)%360;await saveTicket(t);await openManageSection(currentManageSection);await updateCounters()}
async function editTicketAmount(id){const t=await getTicketById(id);if(!t)return;if(t.section==="Tickets gasoil"){const litersValue=prompt("Litros de gasoil:",String(t.liters||0).replace(".",","));if(litersValue===null)return;t.liters=parseAmount(litersValue)}const value=prompt("Nuevo importe:",String(t.amount||0).replace(".",","));if(value===null)return;t.amount=parseAmount(value);await saveTicket(t);await openManageSection(currentManageSection);await updateCounters()}
async function deleteOneTicket(id){if(!confirm("¿Borrar este ticket?"))return;await deleteTicketById(id);await openManageSection(currentManageSection);await updateCounters()}


async function updateApp(){try{if("serviceWorker" in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const reg of regs){await reg.update()}}if(window.caches){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}window.location.href="./?v=13&t="+Date.now()}catch(e){window.location.href="./?v=13&t="+Date.now()}}
async function clearWeeklyTickets(){if(!confirm("¿Borrar solo los tickets semanales? Se borrarán Desayuno, Comida, Cena y Parking de la semana actual. No se borrará Gasoil."))return;const w=getISOWeekData(),all=await getTickets();const tx=db.transaction(STORE_NAME,"readwrite"),store=tx.objectStore(STORE_NAME);all.filter(t=>weeklySections.includes(t.section)).filter(t=>t.week===w.week&&t.year===w.year).forEach(t=>store.delete(t.id));tx.oncomplete=async()=>{await updateCounters();alert("Tickets semanales borrados")}}
async function clearMonthlyTickets(){if(!confirm("¿Borrar solo los tickets mensuales? Se borrará Gasoil del mes actual."))return;const m=getMonthData(),all=await getTickets();const tx=db.transaction(STORE_NAME,"readwrite"),store=tx.objectStore(STORE_NAME);all.filter(t=>monthlySections.includes(t.section)).filter(t=>{if(t.month&&t.monthYear)return t.month===m.monthNumber&&t.monthYear===m.year;const d=new Date(t.createdAt);return d>=m.firstDay&&d<=m.lastDay}).forEach(t=>store.delete(t.id));tx.oncomplete=async()=>{await updateCounters();alert("Tickets mensuales borrados")}}
</script>
